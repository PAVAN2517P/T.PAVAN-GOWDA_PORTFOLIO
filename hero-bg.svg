<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Pixel grid pattern -->
    <pattern id="pixelGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#252b48" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080710" />
      <stop offset="40%" stop-color="#14122c" />
      <stop offset="80%" stop-color="#2d1b4e" />
      <stop offset="100%" stop-color="#4c1d68" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Sky gradient -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />

  <!-- Pixel Stars -->
  <g fill="#ffffff">
    <rect x="120" y="80" width="6" height="6" opacity="0.8"/>
    <rect x="250" y="160" width="4" height="4" opacity="0.6"/>
    <rect x="420" y="70" width="8" height="8" opacity="0.9"/>
    <rect x="680" y="140" width="4" height="4" opacity="0.7"/>
    <rect x="850" y="60" width="6" height="6" opacity="0.9"/>
    <rect x="1100" y="110" width="4" height="4" opacity="0.5"/>
    <rect x="1350" y="90" width="8" height="8" opacity="0.8"/>
    <rect x="1540" y="180" width="6" height="6" opacity="0.6"/>
    <rect x="1780" y="70" width="6" height="6" opacity="0.9"/>
    
    <rect x="190" y="240" width="6" height="6" opacity="0.7"/>
    <rect x="360" y="290" width="4" height="4" opacity="0.6"/>
    <rect x="580" y="220" width="8" height="8" opacity="0.8"/>
    <rect x="940" y="260" width="6" height="6" opacity="0.7"/>
    <rect x="1220" y="200" width="4" height="4" opacity="0.6"/>
    <rect x="1450" y="280" width="8" height="8" opacity="0.9"/>
    <rect x="1690" y="230" width="4" height="4" opacity="0.5"/>
  </g>

  <!-- Retro Synthwave/Pixel Sun -->
  <circle cx="960" cy="560" r="180" fill="url(#sunGrad)" />
  <!-- Sun horizontal raster cuts -->
  <rect x="760" y="520" width="400" height="8" fill="#1b1834" />
  <rect x="760" y="545" width="400" height="12" fill="#1b1834" />
  <rect x="760" y="575" width="400" height="18" fill="#1b1834" />
  <rect x="760" y="610" width="400" height="24" fill="#1b1834" />
  <rect x="760" y="650" width="400" height="32" fill="#1b1834" />

  <!-- Distant Pixel Mountain Silhouettes -->
  <polygon points="0,780 200,640 420,780 700,580 980,780 1300,540 1620,780 1920,620 1920,850 0,850" fill="#181336" opacity="0.85" />
  <polygon points="0,830 260,710 520,830 820,670 1140,830 1480,680 1780,830 1920,740 1920,900 0,900" fill="#0e0a22" />

  <!-- Cyber Horizon Ground -->
  <rect x="0" y="780" width="1920" height="300" fill="#080713" />

  <!-- Perspective Grid Lines on Ground -->
  <g stroke="#8b5cf6" stroke-width="2" opacity="0.4">
    <!-- Horizontal lines -->
    <line x1="0" y1="800" x2="1920" y2="800" />
    <line x1="0" y1="830" x2="1920" y2="830" />
    <line x1="0" y1="875" x2="1920" y2="875" />
    <line x1="0" y1="935" x2="1920" y2="935" />
    <line x1="0" y1="1010" x2="1920" y2="1010" />

    <!-- Perspective convergence lines towards center vanishing point (960, 780) -->
    <line x1="960" y1="780" x2="0" y2="1080" />
    <line x1="960" y1="780" x2="240" y2="1080" />
    <line x1="960" y1="780" x2="480" y2="1080" />
    <line x1="960" y1="780" x2="720" y2="1080" />
    <line x1="960" y1="780" x2="960" y2="1080" />
    <line x1="960" y1="780" x2="1200" y2="1080" />
    <line x1="960" y1="780" x2="1440" y2="1080" />
    <line x1="960" y1="780" x2="1680" y2="1080" />
    <line x1="960" y1="780" x2="1920" y2="1080" />
  </g>

  <!-- Global subtle pixel grid -->
  <rect width="1920" height="1080" fill="url(#pixelGrid)" />
</svg>
